{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="preload"
      href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'">

<noscript>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">
</noscript>

<!-- Support for Font Awesome -->
<link rel="preload"
      href="{{ base_path }}/assets/css/fontawesome.css"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'">

<noscript>
  <link rel="stylesheet"
        href="{{ base_path }}/assets/css/fontawesome.css">
</noscript>

<!-- Robot logo favicon -->
<link rel="apple-touch-icon"
      sizes="180x180"
      href="{{ base_path }}/images/robot-logo.png">

<link rel="icon"
      type="image/png"
      sizes="32x32"
      href="{{ base_path }}/images/robot-logo.png">

<link rel="icon"
      type="image/png"
      sizes="192x192"
      href="{{ base_path }}/images/robot-logo.png">

<meta name="theme-color" content="#172033"/>

<!-- end custom head snippets -->
